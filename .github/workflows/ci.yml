name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Run backend tests
        run: go test ./...
      - name: Build app with the Windows build script
        run: .\build.bat
      - name: Lint frontend
        run: npm run lint
        working-directory: src/frontend
      - name: Install Playwright browser
        run: npx playwright install chromium
        working-directory: src/frontend
      - name: Type-check migration browser tests
        run: npx tsc --ignoreConfig --noEmit --target es2022 --module nodenext --moduleResolution nodenext --types node --skipLibCheck e2e/markdown-import.spec.ts e2e/document-package.spec.ts e2e/csv-import.spec.ts e2e/database-package.spec.ts e2e/glass-ui.spec.ts
        working-directory: src/frontend
      - name: Verify calendar drag in the glass layout
        run: npx playwright test database-workflows.spec.ts -g "calendar drag"
        working-directory: src/frontend
      - name: Verify document and CSV migration browser workflows
        run: npx playwright test markdown-import.spec.ts document-package.spec.ts csv-import.spec.ts database-package.spec.ts glass-ui.spec.ts
        working-directory: src/frontend
      - name: Run browser end-to-end tests
        run: npm run test:e2e
        working-directory: src/frontend
      - name: Upload database UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reverie-Database-UI-Evidence
          path: |
            src/frontend/test-results/database-evidence/
            src/frontend/test-results/import-evidence/
            src/frontend/test-results/glass-evidence/
            src/frontend/test-results/**/trace.zip
            src/frontend/test-results/**/test-failed-*.png
            src/frontend/test-results/**/error-context.md
          if-no-files-found: warn
      - name: Verify launcher rejects unrelated healthy services
        shell: pwsh
        run: .\scripts\test-start-conflict.ps1
      - name: Verify Windows start and graceful stop
        shell: pwsh
        run: |
          $env:REVERIE_NO_BROWSER = '1'
          $root = $env:GITHUB_WORKSPACE
          $start = Start-Process powershell.exe -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', (Join-Path $root 'scripts\start.ps1')) -PassThru -WindowStyle Hidden
          try {
            $serviceFile = Join-Path $root 'runtime\service.json'
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              if (Test-Path $serviceFile) {
                try {
                  $metadata = Get-Content -Raw $serviceFile | ConvertFrom-Json
                  $owner = Get-NetTCPConnection -LocalPort 8765 -State Listen -ErrorAction SilentlyContinue |
                    Where-Object { $_.OwningProcess -eq [int]$metadata.pid }
                  $health = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/api/health' -UseBasicParsing -TimeoutSec 2
                  $frontend = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/' -UseBasicParsing -TimeoutSec 2
                  if ($owner -and $health.Content -match '"status":"ok"' -and
                      $frontend.Content -match '<div id="root">') {
                    $ready = $true
                    break
                  }
                } catch {}
              }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Windows service did not become ready.' }
            $firstPid = [int]$metadata.pid
            $secondStartLog = Join-Path $env:RUNNER_TEMP 'reverie-second-start.log'
            $secondStart = Start-Process powershell.exe -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', (Join-Path $root 'scripts\start.ps1')) -PassThru -Wait -WindowStyle Hidden -RedirectStandardOutput $secondStartLog
            if ($secondStart.ExitCode -ne 0 -or (Get-Content -Raw $secondStartLog) -notmatch 'already running') {
              throw 'A second start did not recognize the existing owned instance.'
            }
            $metadata = Get-Content -Raw $serviceFile | ConvertFrom-Json
            if ([int]$metadata.pid -ne $firstPid) { throw 'A second start replaced the owned service metadata.' }
            & (Join-Path $root 'stop.bat')
            if ($LASTEXITCODE -ne 0) { throw 'Graceful stop script failed.' }
            $start.WaitForExit(15000)
            if (-not $start.HasExited) { throw 'Start console did not exit after graceful shutdown.' }
          } finally {
            if (Test-Path (Join-Path $root 'runtime\service.json')) {
              & (Join-Path $root 'stop.bat')
            }
            if (Test-Path (Join-Path $env:RUNNER_TEMP 'reverie-second-start.log')) {
              Remove-Item (Join-Path $env:RUNNER_TEMP 'reverie-second-start.log') -Force
            }
          }
      - name: Native Windows portable acceptance
        run: python scripts/test-portable.py
      - name: Versioned Windows archive
        run: python scripts/package.py --target windows-amd64
      - name: Upload versioned Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: Reverie-Planner-0.0.1-windows-amd64
          path: release/*.zip
      - name: Package portable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Reverie-Planner-Windows
          path: |
            runtime/ReveriePlanner.exe
            config/app.json
            config/providers.example.json
            src/frontend/dist/
            README.md
            build.bat
            start.bat
            stop.bat
            scripts/start.ps1
            scripts/stop.ps1

  unix-portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go test ./...
      - run: ./build.sh
      - run: npm run lint
        working-directory: src/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: src/frontend
      - name: Type-check migration browser tests
        run: npx tsc --ignoreConfig --noEmit --target es2022 --module nodenext --moduleResolution nodenext --types node --skipLibCheck e2e/markdown-import.spec.ts e2e/document-package.spec.ts e2e/csv-import.spec.ts e2e/database-package.spec.ts e2e/glass-ui.spec.ts
        working-directory: src/frontend
      - name: Verify calendar drag in the glass layout
        run: npx playwright test database-workflows.spec.ts -g "calendar drag"
        working-directory: src/frontend
      - name: Verify document and CSV migration browser workflows
        run: npx playwright test markdown-import.spec.ts document-package.spec.ts csv-import.spec.ts database-package.spec.ts glass-ui.spec.ts
        working-directory: src/frontend
      - run: npm run test:e2e
        working-directory: src/frontend
      - name: Upload workspace and database UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reverie-UI-${{ matrix.os }}
          path: |
            src/frontend/test-results/database-evidence/
            src/frontend/test-results/import-evidence/
            src/frontend/test-results/glass-evidence/
            src/frontend/test-results/**/trace.zip
            src/frontend/test-results/**/test-failed-*.png
            src/frontend/test-results/**/error-context.md
          if-no-files-found: warn
      - run: python3 scripts/test-portable.py
      - name: Package native portable app
        shell: bash
        run: python3 scripts/package.py --target "$(go env GOOS)-$(go env GOARCH)"
      - uses: actions/upload-artifact@v4
        with:
          name: Reverie-Planner-0.0.1-${{ matrix.os }}
          path: release/*

  release-v001:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, unix-portable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Reverie-Planner-0.0.1-*
          path: packages
      - name: Publish verified portable version once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.0.1 >/dev/null 2>&1; then
            echo 'v0.0.1 already exists; published assets are immutable.'
            exit 0
          fi
          mapfile -d '' files < <(find packages -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0)
          if [ "${#files[@]}" -ne 3 ]; then
            echo 'Expected exactly three native platform archives.' >&2
            exit 1
          fi
          gh release create v0.0.1 "${files[@]}" --target "$GITHUB_SHA" --title 'Reverie Planner V0.0.1' --notes-file docs/RELEASE_V0.0.1.md
      - name: Keep only main and dev after verified integration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/dev -f sha="$GITHUB_SHA"
          fi
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --unshallow origin
          fi
          while IFS= read -r branch; do
            case "$branch" in main|dev) continue ;; esac
            if git merge-base --is-ancestor "refs/remotes/origin/$branch" refs/remotes/origin/main || git merge-base --is-ancestor "refs/remotes/origin/$branch" refs/remotes/origin/dev; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
              echo "Removed integrated branch: $branch"
            else
              echo "Unique commits remain on $branch; refusing deletion." >&2
              exit 1
            fi
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name')
