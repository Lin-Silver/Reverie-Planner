name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Run backend tests
        run: go test ./...
      - name: Build app with the Windows build script
        run: .\build.bat
      - name: Lint frontend
        run: npm run lint
        working-directory: src/frontend
      - name: Install Playwright browser
        run: npx playwright install chromium
        working-directory: src/frontend
      - name: Run browser end-to-end tests
        run: npm run test:e2e
        working-directory: src/frontend
      - name: Verify launcher rejects unrelated healthy services
        shell: pwsh
        run: .\scripts\test-start-conflict.ps1
      - name: Verify Windows start and graceful stop
        shell: pwsh
        run: |
          $env:REVERIE_NO_BROWSER = '1'
          $root = $env:GITHUB_WORKSPACE
          $start = Start-Process powershell.exe -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', (Join-Path $root 'scripts\start.ps1')) -PassThru -WindowStyle Hidden
          try {
            $serviceFile = Join-Path $root 'runtime\service.json'
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              if (Test-Path $serviceFile) {
                try {
                  $metadata = Get-Content -Raw $serviceFile | ConvertFrom-Json
                  $owner = Get-NetTCPConnection -LocalPort 8765 -State Listen -ErrorAction SilentlyContinue |
                    Where-Object { $_.OwningProcess -eq [int]$metadata.pid }
                  $health = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/api/health' -UseBasicParsing -TimeoutSec 2
                  $frontend = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/' -UseBasicParsing -TimeoutSec 2
                  if ($owner -and $health.Content -match '"status":"ok"' -and
                      $frontend.Content -match '<div id="root">') {
                    $ready = $true
                    break
                  }
                } catch {}
              }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Windows service did not become ready.' }
            $firstPid = [int]$metadata.pid
            $secondStartLog = Join-Path $env:RUNNER_TEMP 'reverie-second-start.log'
            $secondStart = Start-Process powershell.exe -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', (Join-Path $root 'scripts\start.ps1')) -PassThru -Wait -WindowStyle Hidden -RedirectStandardOutput $secondStartLog
            if ($secondStart.ExitCode -ne 0 -or (Get-Content -Raw $secondStartLog) -notmatch 'already running') {
              throw 'A second start did not recognize the existing owned instance.'
            }
            $metadata = Get-Content -Raw $serviceFile | ConvertFrom-Json
            if ([int]$metadata.pid -ne $firstPid) { throw 'A second start replaced the owned service metadata.' }
            & (Join-Path $root 'stop.bat')
            if ($LASTEXITCODE -ne 0) { throw 'Graceful stop script failed.' }
            $start.WaitForExit(15000)
            if (-not $start.HasExited) { throw 'Start console did not exit after graceful shutdown.' }
          } finally {
            if (Test-Path (Join-Path $root 'runtime\service.json')) {
              & (Join-Path $root 'stop.bat')
            }
            if (Test-Path (Join-Path $env:RUNNER_TEMP 'reverie-second-start.log')) {
              Remove-Item (Join-Path $env:RUNNER_TEMP 'reverie-second-start.log') -Force
            }
          }
      - name: Package portable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Reverie-Planner-Windows
          path: |
            runtime/ReveriePlanner.exe
            config/app.json
            config/providers.example.json
            src/frontend/dist/
            README.md
            build.bat
            start.bat
            stop.bat
            scripts/start.ps1
            scripts/stop.ps1
